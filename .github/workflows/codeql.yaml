# Reusable CodeQL analysis workflow for PlayFaster Python integrations.
# Called by each integration repo's codeql.yml via workflow_call.

name: "CodeQL (Shared)"

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: "CodeQL Analysis (Python)"
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the repository
      security-events: write # Required to upload CodeQL SARIF results to GitHub Security

    steps:
      - name: Checkout Repository
        # Tag @v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # Tag @v4 - 4.36.2
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          languages: python

      - name: Perform CodeQL Analysis
        # Tag @v4 - 4.36.2
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
        with:
          category: "/language:python"
