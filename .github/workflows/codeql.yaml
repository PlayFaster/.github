# Reusable CodeQL analysis workflow for PlayFaster Python integrations.
# Called by each integration repo's codeql.yml via workflow_call.

name: "CodeQL (Shared)"

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: "CodeQL Analysis (Python)"
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the repository
      security-events: write # Required to upload CodeQL SARIF results to GitHub Security

    steps:
      - name: Checkout Repository
        # Tag @v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # Tag @v4 - 4.37.3
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          languages: python

      - name: Perform CodeQL Analysis
        # Tag @v4 - 4.37.3
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          category: "/language:python"
