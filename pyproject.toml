# SYNCED FILE — DO NOT EDIT IN A TARGET ROOT.
# Edit dev-workbench/host-tooling/github/pyproject.toml and re-sync via dev-workbench/scripts/sync_projects.ps1.

[project]
name = "github"
# Version is dummy and required for UV. Do NOT Edit
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
extend = ".validate/pyproject_common.toml"

[tool.codespell]
skip = ".git,.reports,node_modules,.validate,.workbench,.venv,.ruff_cache,.gptcache,*.log,*.db,*.db-shm,*.db-wal,*.ffs_*,*.code-workspace,local_only,mutants,scratch,temp_check,CLAUDE.md,uv.lock"
ignore-words-list = "hass"

[tool.uv]
# 7-day release-age wait for every uv resolve in this repo (uv run --with, uv pip install).
exclude-newer = "7 days"
